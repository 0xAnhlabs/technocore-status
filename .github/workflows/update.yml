name: Update Technocore status

on:
  schedule:
    # Every 5 minutes. Fully hosted on GitHub — no dependency on the owner's machine.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch snapshot
        run: python3 update.py

      - name: Commit status.json
        run: |
          git config user.name "0xAnh bot"
          git config user.email "0xAnh@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
